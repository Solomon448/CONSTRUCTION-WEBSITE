<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Background Container -->
  <rect width="64" height="64" rx="16" fill="#050505"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#goldGradient)" stroke-width="1.5" stroke-opacity="0.4"/>
  
  <defs>
    <linearGradient id="goldGradient" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCEEAC"/>
      <stop offset="40%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#997A15"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="32" y1="0" x2="32" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="32" cy="24" r="20" fill="url(#glowGrad)" />

  <!-- Modern Architectural Roof & Pillar Geometry -->
  <path d="M14 42L32 18L50 42" stroke="url(#goldGradient)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M22 42V30L32 20L42 30V42" stroke="url(#goldGradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.8"/>
  
  <!-- Architectural Monogram 'R' Accent -->
  <path d="M28 26H35C37.2091 26 39 27.7909 39 30C39 32.2091 37.2091 34 35 34H28V26Z" fill="url(#goldGradient)" fill-opacity="0.3" stroke="url(#goldGradient)" stroke-width="1.5"/>
  <path d="M33 34L39 42" stroke="url(#goldGradient)" stroke-width="2.2" stroke-linecap="round"/>
  
  <!-- Foundation Line -->
  <line x1="12" y1="46" x2="52" y2="46" stroke="url(#goldGradient)" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Luxury Emerald Dot -->
  <circle cx="32" cy="14" r="2.5" fill="#10B981"/>
</svg>
